# Rechazar campos que el tipo no declara.
#
# `@JsonIgnoreProperties(ignoreUnknown = false)` sobre un `record` no basta:
# Jackson lo ignora en ese caso y hay que activarlo en el deserializador. Es un
# ajuste GLOBAL, no por tipo — una diferencia real frente a FastAPI, donde
# `extra="forbid"` se declara en el modelo que lo necesita.
spring.jackson.deserialization.fail-on-unknown-properties=true
