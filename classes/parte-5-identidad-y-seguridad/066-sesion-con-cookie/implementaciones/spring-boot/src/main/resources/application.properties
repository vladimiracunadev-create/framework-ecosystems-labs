# La sesion la lleva el contenedor de servlets (Tomcat): aqui solo se declara
# como debe viajar su cookie. Los atributos no son decoracion — HttpOnly la
# esconde del script de la pagina y SameSite=Lax evita que viaje en peticiones
# provocadas desde otra pagina.
server.servlet.session.cookie.name=sesion
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
