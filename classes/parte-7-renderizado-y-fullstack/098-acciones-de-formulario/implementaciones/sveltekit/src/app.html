<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Clase 098</title>
    %sveltekit.head%
  </head>
  <body>
    <!--
      LA PLANTILLA DE LA PÁGINA, con dos huecos que SvelteKit rellena.

      `%sveltekit.head%` recibe los enlaces a hojas de estilo y los metadatos de
      la ruta; `%sveltekit.body%` recibe el marcado del componente.

      Que exista este archivo es la señal de que SvelteKit controla el documento
      entero: no hay un `index.html` que el enrutador manipule después. Por eso
      la clase 101 —metadatos— tiene aquí una respuesta limpia.
    -->
    <div>%sveltekit.body%</div>
  </body>
</html>
