spring.datasource.url=jdbc:h2:mem:clase057;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Ver el SQL emitido es lo que convierte esta clase en algo comprobable: con
# transacción se ve el UPDATE y después el ROLLBACK; sin ella, un COMMIT
# inmediato después del primer UPDATE.
spring.jpa.show-sql=true
