spring.datasource.url=jdbc:h2:mem:clase056;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# El contador de sentencias de Hibernate. Es la forma nativa de medir cuántas
# consultas cuesta una operación — mucho más fiable que contar líneas del
# registro, y lo que hace verificable esta clase.
spring.jpa.properties.hibernate.generate_statistics=true

# Ver el SQL emitido convierte el problema N+1 en algo visible en lugar de
# sospechado.
spring.jpa.show-sql=true
