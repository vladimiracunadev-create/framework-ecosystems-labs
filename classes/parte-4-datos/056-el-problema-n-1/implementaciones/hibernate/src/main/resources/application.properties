spring.datasource.url=jdbc:h2:mem:clase056;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# El contador de sentencias de Hibernate. Es la forma nativa de medir cuántas
# consultas cuesta una operación — mucho más fiable que contar líneas del
# registro, y lo que hace verificable esta clase.
spring.jpa.properties.hibernate.generate_statistics=true

# Ver el SQL emitido convierte el problema N+1 en algo visible en lugar de
# sospechado.
spring.jpa.show-sql=true

# APAGAR EL CONTEXTO DE PERSISTENCIA POR PETICIÓN.
#
# Con `open-in-view` activado —el valor por omisión de Spring Boot— toda la
# petición comparte un EntityManager. Y eso rompe la medición de esta clase:
# `/crecimiento` siembra y mide en la misma petición, así que las entidades
# recién guardadas siguen en la caché de primer nivel con sus colecciones ya
# pobladas, y la forma ingenua no dispara NI UNA consulta extra.
#
# Es un ejemplo perfecto del propio problema: la caché escondía la medida.
spring.jpa.open-in-view=false
