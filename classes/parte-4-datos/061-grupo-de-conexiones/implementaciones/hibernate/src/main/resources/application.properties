spring.datasource.url=jdbc:h2:mem:clase061;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# EL GRUPO. Dos conexiones, a propósito: con el valor por omisión —diez— haría
# falta lanzar once peticiones a la vez para ver algo, y la clase trata
# justamente de que este número es pequeño y finito.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=2

# Un segundo esperando, y después un fallo DECLARADO. Sin límite, una petición
# que no consigue conexión se queda colgada — y una petición colgada es peor que
# una que falla, porque retiene su propio hilo mientras espera.
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.pool-name=clase061
