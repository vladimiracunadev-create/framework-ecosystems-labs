# H2 en memoria, la base embebida del ecosistema JVM. No hace falta instalar
# nada y desaparece al terminar el proceso, que es justo lo que quieres en una
# clase y en una prueba.
spring.datasource.url=jdbc:h2:mem:clase051;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Ver el SQL que Hibernate genera es la mejor forma de entender qué hace por ti
# —y de descubrir el problema N+1 de la clase 056 antes de que llegue a
# producción.
spring.jpa.show-sql=true
