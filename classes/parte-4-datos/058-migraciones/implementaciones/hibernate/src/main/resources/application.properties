spring.datasource.url=jdbc:h2:mem:clase058;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

# LO MÁS IMPORTANTE DE ESTE ARCHIVO.
#
# `ddl-auto=none` apaga la creación automática del esquema por parte de
# Hibernate. Con `create-drop` —lo cómodo en desarrollo— Hibernate construiría
# las tablas a partir de las entidades y Flyway se encontraría una base que no
# reconoce. Las dos herramientas quieren mandar sobre el esquema, y solo puede
# mandar una.
spring.jpa.hibernate.ddl-auto=none

# Flyway lee `db/migration/V*.sql` y aplica lo que falte.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
