# La configuración mínima de Alembic. `script_location` apunta a la carpeta con
# las revisiones, y `sqlalchemy.url` a la base sobre la que se aplican.
[alembic]
script_location = migraciones
sqlalchemy.url = sqlite:///datos.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generico

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
