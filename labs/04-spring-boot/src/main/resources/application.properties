# El puerto se recibe por entorno (SERVER_PORT) para que el ejecutor de las
# pruebas de aceptación decida dónde escucha cada implementación.
server.port=${PORT:3003}
server.address=127.0.0.1

# Sin esto, una ruta desconocida devuelve la página de error del framework en
# lugar del sobre de error del contrato.
spring.mvc.throw-exception-if-no-handler-found=true
server.error.whitelabel.enabled=false

# El detalle interno se registra, no se publica.
server.error.include-message=never
server.error.include-stacktrace=never
